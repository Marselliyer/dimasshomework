<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./img/logo.svg" type="image/x-icon">
  <title>Форма</title>
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <form action="">
    <fieldset class="field_top">
      <legend class="form_title">Ваши личные данные</legend>
      <label class="form_label" for="">Ваше имя
        <input class="form_input" type="text" placeholder="Имя" name="name" required>
      </label>
      <label class="form_label" for="">Ваш возраст
        <input class="form_input" type="number" placeholder="Возраст" name="date" required>
      </label>
      <label class="form_label" for="">Ваш номер телефона
        <input class="form_input" type="tel" placeholder="Номер телефона" name="number" required>
      </label>
      <label class="form_label" for="">Ваша почта
        <input class="form_input" type="email" placeholder="Почта" name="email" required>
      </label>
    </fieldset>
    <fieldset class="field_bottom">
      <label class="form_label" for="">Сообщение
        <textarea class="form_input" name="info" id="" placeholder="Ваше сообщение" required></textarea>
      </label>
      <label class="form_label" for="">
        <input class="checkbox" type="checkbox" name="rule" required>
        Я принимаю правила
      </label>
      <button class="button" type="submit">Отправить</button>
    </fieldset>
  </form>

  <script src="js/main.js"></script>

</body>

</html>
