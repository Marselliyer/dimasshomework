  <form action="">
    <fieldset>
      <h3 class="form_title">Ваши личные данные</h3>
      <label class="form_label" for="">Ваше имя
        <input class="form_input" type="text" placeholder="Имя" name="name" required>
      </label>
      <label class="form_label" for="">Ваш возраст
        <input class="form_input" type="number" placeholder="Возраст" name="date" required>
      </label>
      <label class="form_label" for="">Ваш номер телефона
        <input class="form_input" type="tel" placeholder="Номер телефона" name="number" required>
      </label>
      <label class="form_label" for="">Ваша почта
        <input class="form_input" type="email" placeholder="Почта" name="email" required>
      </label>
      <label class="form_label" for="">Сообщение
        <textarea name="info" id="" placeholder="Ваше сообщение" required></textarea>
      </label>
      <label class="form_label" class="check" for="">
        <input class="choice" type="checkbox" name="rule" required>
        Я принимаю правила
      </label>
      <button class="button" type="submit">Отправить</button>
    </fieldset>
  </form>
